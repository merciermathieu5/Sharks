name: Relève des alignements USHL

# Copie les 32 alignements relevés par le dépôt central ushl-releve
# (data/rosters.json) dans data/rosters.json. Aucune requête vers ushl.ca.
#
# Depuis le 26 novembre 2026, ushl-releve relève la ligue une seule fois puis
# lance ce workflow dans chaque interface. Avant, chacun des 22 dépôts relevait
# les 32 pages lui-même (plus de 700 requêtes en quelques minutes) et ushl.ca
# servait sa page anti-robot à presque tous.
#
# Le cron reste comme filet de sécurité si un déclenchement se perd. Aussi à
# la demande depuis l'onglet Actions (bouton « Run workflow »). Pour relever
# ushl.ca de nouveau, lancer « Relève centrale des alignements USHL » dans
# ushl-releve. scripts/fetch-rosters.mjs reste dans le dépôt en dépannage.
on:
  schedule:
    - cron: '50 11 * * *'   # 11:50 UTC ≈ 07:50 heure de l'Est
  workflow_dispatch:

permissions:
  contents: write

# Même groupe que production.yml : les deux relevés ne poussent jamais en même temps.
concurrency:
  group: releve-rosters
  cancel-in-progress: false

jobs:
  copier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Télécharger le relevé central
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/merciermathieu5/ushl-releve/contents/data/rosters.json \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/rosters.json"

      - name: Vérifier et copier
        run: node scripts/copier-rosters.mjs "$RUNNER_TEMP/rosters.json"

      - name: Committer si le fichier a changé
        run: |
          if [[ -z "$(git status --porcelain data/rosters.json)" ]]; then
            echo "Aucun changement dans les alignements."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rosters.json
          git commit -m "Alignements USHL : copie du relevé central du $(TZ=America/Toronto date +'%Y-%m-%d %H:%M')"
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
          git push
