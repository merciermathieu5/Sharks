name: Relève de la production USHL

# Copie la production de ce club (pointage, fiche et XtraStats) depuis le
# relevé central de ushl-releve (data/production.json) dans
# data/production.json. Aucune requête vers ushl.ca. L'onglet Progression lit
# ce fichier à l'ouverture, sans relais public.
#
# Depuis le 27 novembre 2026, ushl-releve relève la production des 22 clubs
# une seule fois après chaque simulation, puis lance ce workflow dans chaque
# interface. Avant, chacun des 22 dépôts relevait ushl.ca lui-même (une
# soixantaine de relèves par jour) : ushl.ca servait sa page anti-robot et les
# relèves échouaient en série (courriels « Run failed »).
#
# Les crons restent comme filet de sécurité si un déclenchement se perd. Aussi
# à la demande depuis l'onglet Actions (bouton « Run workflow »). Pour relever
# ushl.ca de nouveau, lancer « Relève centrale de la production USHL » dans
# ushl-releve. scripts/fetch-production.mjs reste dans le dépôt en dépannage.
on:
  schedule:
    - cron: '59 3 * * *'   # filet de sécurité (copie seulement)
    - cron: '55 11 * * *'   # filet de sécurité (copie seulement)
  workflow_dispatch:

permissions:
  contents: write

# Même groupe que rosters.yml : les deux copies ne poussent jamais en même temps.
concurrency:
  group: releve-rosters
  cancel-in-progress: false

jobs:
  copier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Télécharger le relevé central
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/merciermathieu5/ushl-releve/contents/data/production.json \
            -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/production.json"

      - name: Vérifier et copier
        run: node scripts/copier-production.mjs "$RUNNER_TEMP/production.json"

      - name: Committer si le fichier a changé
        run: |
          if [[ -z "$(git status --porcelain data/production.json)" ]]; then
            echo "Aucun changement dans la production."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/production.json
          git commit -m "Production USHL : copie du relevé central du $(TZ=America/Toronto date +'%Y-%m-%d %H:%M')"
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
          git push
